# Generated by Comparison/scripts/write_graph2mat_configs.py
data:
  out_matrix: hamiltonian
  symmetric_matrix: true
  sub_point_matrix: false
  matrix_component_policy: h_only
  n_matrix_components: 1
  basis_files: ../AtomDisplacement/dataset/material_basis/*.ion.xml
  val_runs: ../AtomDisplacement/dataset/validation_samples/*/RUN.fdf
  batch_size: 10
  store_in_memory: true
  train_runs: ../AtomDisplacement/dataset/train_samples/*/RUN.fdf
model:
  num_interactions: 1
  correlation: 1
  max_ell: 2
  hidden_irreps: 10x0e + 10x1o + 10x2e
  loss: graph2mat.metrics.block_type_mae
  optim_lr: 0.005
trainer:
  accelerator: cpu
  logger:
    class_path: TensorBoardLogger
    init_args:
      name: h2o_fc_model
      save_dir: lightning_logs
  max_epochs: 200

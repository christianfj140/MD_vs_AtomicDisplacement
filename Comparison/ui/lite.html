<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comparison UI Lite</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111318;
        color: #f1f5f9;
      }
      body {
        margin: 0;
        padding: 24px;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
      }
      header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        margin-bottom: 20px;
      }
      h1 {
        margin: 0;
        font-size: 24px;
      }
      .muted {
        color: #94a3b8;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }
      .card {
        border: 1px solid #293241;
        background: #171b23;
        border-radius: 8px;
        padding: 14px;
      }
      .label {
        color: #94a3b8;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .value {
        margin-top: 6px;
        font-size: 18px;
        overflow-wrap: anywhere;
      }
      button,
      a.button {
        display: inline-flex;
        align-items: center;
        border: 1px solid #3b82f6;
        background: #1d4ed8;
        color: white;
        border-radius: 6px;
        padding: 8px 12px;
        text-decoration: none;
        cursor: pointer;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        min-height: 360px;
        max-height: 65vh;
        overflow: auto;
        border: 1px solid #293241;
        background: #090b10;
        border-radius: 8px;
        padding: 14px;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Comparison UI Lite</h1>
          <div class="muted">Status ligero sin plots ni resultados archivados.</div>
        </div>
        <div>
          <button id="refresh">Refresh</button>
          <a class="button" href="/">Full UI</a>
        </div>
      </header>
      <section class="grid">
        <div class="card">
          <div class="label">Run</div>
          <div id="run-id" class="value">-</div>
        </div>
        <div class="card">
          <div class="label">Estado</div>
          <div id="state" class="value">-</div>
        </div>
        <div class="card">
          <div class="label">Actual</div>
          <div id="current" class="value">-</div>
        </div>
        <div class="card">
          <div class="label">ETA</div>
          <div id="eta" class="value">-</div>
        </div>
      </section>
      <pre id="logs">Loading...</pre>
    </main>
    <script>
      const fmt = (seconds) => {
        if (seconds == null || !Number.isFinite(Number(seconds))) return "-";
        const total = Math.max(0, Math.round(Number(seconds)));
        const h = Math.floor(total / 3600);
        const m = Math.floor((total % 3600) / 60);
        const s = total % 60;
        return h ? `${h}h ${m}m ${s}s` : m ? `${m}m ${s}s` : `${s}s`;
      };

      async function requestJson(path) {
        const response = await fetch(path, { cache: "no-store" });
        if (!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
        return response.json();
      }

      async function refresh() {
        try {
          const [status, logs] = await Promise.all([
            requestJson("/api/experiment/status"),
            requestJson("/api/experiment/logs?since=0&limit=80"),
          ]);
          document.getElementById("run-id").textContent = status.run_id || "-";
          document.getElementById("state").textContent = status.running
            ? `Running (${status.active_processes || 0} procesos activos)`
            : status.returncode == null || status.returncode === 0
              ? "Idle"
              : `Exit ${status.returncode}`;
          const current = status.current;
          document.getElementById("current").textContent = current
            ? `${current.pipeline || "-"} ${current.dataset_label || `dataset_${current.size || "-"}`}`
            : "-";
          document.getElementById("eta").textContent = current
            ? `${fmt(current.elapsed_seconds)} elapsed / ${fmt(current.eta_seconds)} ETA`
            : "-";
          document.getElementById("logs").textContent = (logs.lines || []).join("");
        } catch (error) {
          document.getElementById("logs").textContent = error.stack || error.message;
        }
      }

      document.getElementById("refresh").addEventListener("click", refresh);
      refresh();
      setInterval(refresh, 5000);
    </script>
  </body>
</html>

training:
  torch_float32_matmul_precision: high
  data:
    out_matrix: hamiltonian
    symmetric_matrix: true
    sub_point_matrix: false
    matrix_component_policy: h_only
    n_matrix_components: 1
    basis_files: ../dataset/MD_steps/basis/*.ion.xml
    train_runs: ../dataset/splits/train/*/RUN.fdf
    val_runs: ../dataset/splits/validation/*/RUN.fdf
    batch_size: 64
    store_in_memory: true
    loader_threads: 4
  model:
    num_interactions: 3
    correlation: 2
    max_ell: 3
    hidden_irreps: 32x0e + 32x1o + 32x2e + 32x3o
    loss: graph2mat.core.data.metrics.block_type_huber
    optim_lr: 0.005
    loss_kwargs:
      beta: 0.01
  trainer:
    accelerator: gpu
    logger:
      class_path: TensorBoardLogger
      init_args:
        name: my_first_model
        save_dir: lightning_logs
    max_epochs: 1200
  seed_everything: 0
  benchmark_metadata:
    benchmark_method_id: graphene_5x5_default_huber_0p01_honly_real_ghost_pseudo
    architecture: default_mace_graph2mat
    readout: default
    diagnostic_only: false
    seed: 0
    loss: graph2mat.core.data.metrics.block_type_huber
    loss_kwargs: &id001
      beta: 0.01
    dataset_reference_policy: real_siesta_tshs_or_hsx_only_no_ml_prediction
    fdf_template: materials/graphene_5x5/RUN.fdf
    fdf_template_note: SIESTA graphene 5x5 50-carbon supercell template.
    ghost_pseudopotential: materials/graphene/pseudos/Ghost-H.psf
    ghost_pseudopotential_source: /home/christian/repositorios/prueba_amaro/Ghost-H.psf
    ghost_pseudopotential_sha256: 50878f06f8171e9a243eeaaedd49461a1e72d9d015f66f66a8158f14116aefdb
    kpoint_mesh: 4x4x1
  ui_training_settings:
    max_epochs: 1200
    batch_size: 64
    loader_threads: 4
    num_interactions: 3
    correlation: 2
    seed_everything: 0
    max_ell: 3
    optim_lr: 0.005
    loss: graph2mat.core.data.metrics.block_type_huber
    hidden_irreps: 32x0e + 32x1o + 32x2e + 32x3o
    loss_kwargs:
      beta: 0.01
    benchmark_metadata:
      benchmark_method_id: graphene_5x5_default_huber_0p01_honly_real_ghost_pseudo
      architecture: default_mace_graph2mat
      readout: default
      diagnostic_only: false
      seed: 0
      loss: graph2mat.core.data.metrics.block_type_huber
      loss_kwargs: *id001
      dataset_reference_policy: real_siesta_tshs_or_hsx_only_no_ml_prediction
      fdf_template: materials/graphene_5x5/RUN.fdf
      fdf_template_note: SIESTA graphene 5x5 50-carbon supercell template.
      ghost_pseudopotential: materials/graphene/pseudos/Ghost-H.psf
      ghost_pseudopotential_source: /home/christian/repositorios/prueba_amaro/Ghost-H.psf
      ghost_pseudopotential_sha256: 50878f06f8171e9a243eeaaedd49461a1e72d9d015f66f66a8158f14116aefdb
      kpoint_mesh: 4x4x1
    data:
      out_matrix: hamiltonian
      matrix_component_policy: h_only
      n_matrix_components: 1
      symmetric_matrix: true
checkpoint:
  path: null
  auto_best: true
  search_glob: lightning_logs/**/checkpoints/best-*.ckpt
  selection: latest_version
testing:
  test_runs: ../dataset/splits/test/*/RUN.fdf
  callbacks:
    plot_matrix_error: false
    show_plot: false
    samplewise_metrics_logger: false
  data:
    store_in_memory: true
prediction:
  predict_structs: ../dataset/splits/test/*/RUN.fdf
  output_file: ML_prediction.HSX
  callbacks:
    matrix_writer: true
  data:
    store_in_memory: true
pipeline:
  skip_model_test: false
  steps:
  - run_md_training
  - run_md_testing
  - run_md_prediction
performance:
  max_parallel_siesta_jobs: 1
  max_parallel_dataset_jobs: 1
  max_parallel_prediction_jobs: 1
  max_parallel_evaluation_jobs: 4
  max_parallel_metric_jobs: 12
  omp_num_threads: 2
  mkl_num_threads: 2
  openblas_num_threads: 2
  numexpr_num_threads: 12
  torch_num_threads: 8
  compute_accelerator: gpu
  batch_size: 64
  store_in_memory: true
  reuse_validated_siesta_outputs: false
  enable_experiment_cache: false
  error_policy: fail_fast
  preset: aggressive
  torch_float32_matmul_precision: high
  warnings: []
splits:
  enabled: true
  strategy: blocked_with_gap
  temporal_gap: 1
  block_order: train,validation,test
  train: 6
  validation: 1
  test: 1
single_points:
  workers: 1
  rerun: true

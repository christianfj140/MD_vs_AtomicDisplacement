# Generated from ../pipeline_config.yaml
data:
  out_matrix: hamiltonian
  symmetric_matrix: true
  basis_files: ../relaxed/*.ion.xml
  runs_json: runs.json
  batch_size: 10
  store_in_memory: true
model:
  num_interactions: 1
  correlation: 1
  max_ell: 2
  hidden_irreps: 10x0e + 10x1o + 10x2e
  loss: graph2mat.metrics.block_type_mae
  optim_lr: 0.005
trainer:
  accelerator: cpu
  logger:
    class_path: TensorBoardLogger
    init_args:
      name: atom_displacement_model
      save_dir: lightning_logs
  max_epochs: 200
